packages:
  - apps/*
  - packages/*

# Flat node_modules like MoyoLearn: the TanStack Start/Vite apps resolve
# react-native-web's transitive CJS closure (fbjs, styleq, inline-style-prefixer…)
# from the workspace root; pnpm's isolated layout hides it inside .pnpm and Vite's
# dep optimizer then cannot see the packages it is asked to pre-bundle.
nodeLinker: hoisted

# Expo SDK 58 stable owns the React / RN / Metro compatibility matrix.
# Keep these overrides aligned with the SDK 58 template instead of forcing
# upstream "latest" versions that Expo has not validated together.
overrides:
  lightningcss: 1.30.1
  react: 19.3.0
  react-dom: 19.3.0
  "@expo/dom-webview": 58.0.2
  "@payloadcms/plugin-cloud-storage": 4.0.0-canary.33

# Public Viro is retained only for web/Storybook/CI resolution in this public
# repository. Native commands hard-require mikevocalz/viro via
# apps/mobile/scripts/assert-viro-fork.mjs. This extension prevents the public
# fallback's stale peer metadata from poisoning non-native CI resolution; it
# must not be treated as native compatibility evidence.
packageExtensions:
  '@reactvision/react-viro@3.0.2':
    peerDependencies:
      expo: '>=57.0.0 <59.0.0'
      react-native: '>=0.86.0 <0.89.0'
      '@reactvision/react-native-visionos': '>=0.86.0 <0.89.0'
  # Intentional compatibility lane: this starter stays on Nitro 0.37.x.
  # Rive 0.5.0 still publishes a <0.37 peer cap, so keep this extension
  # explicit until upstream widens its declared range.
  '@rive-app/react-native@0.5.0':
    peerDependencies:
      react-native-nitro-modules: '>=0.37.0 <0.38'

allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
  kinetrell@https://codeload.github.com/mikevocalz/Kinetrell/tar.gz/344de51531ce050c4311d3feb70e4d596bdc8041: true

# Expo SDK 58 packages were published together. Keep pnpm's 24-hour
# release-age protection for the rest of the graph while allowing the explicitly
# selected Expo 58 family to install immediately.
minimumReleaseAgeExclude:
  - '@shopify/*'
  - 'canvaskit-wasm'
  - '@expo/*'
  - '@rive-app/*'
  - '@reactvision/*'
  - 'react-native-webgpu'
  - 'react-native-audio-api'
  - expo
  - 'expo-*'
  - babel-preset-expo
  - eslint-config-expo
  - eslint-plugin-expo@1.2.1
  - lucide-react-native@1.51.0
  - lucide-react@1.51.0
  - "@payloadcms/db-postgres@4.0.0-canary.39"
  - "@payloadcms/drizzle@4.0.0-canary.39"
  - "@payloadcms/graphql@4.0.0-canary.39"
  - "@payloadcms/next@4.0.0-canary.39"
  - "@payloadcms/plugin-mcp@4.0.0-canary.39"
  - "@payloadcms/translations@4.0.0-canary.39"
  - "@payloadcms/ui@4.0.0-canary.39"
  - payload@4.0.0-canary.39

