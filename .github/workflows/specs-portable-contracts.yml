name: Specs portable contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specs:
    name: Native Lens scene projections (no private deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Test pure TypeScript scene and handoff contracts
        run: |
          node --experimental-strip-types --test packages/app/features/specs/*.test.ts apps/specs/tests/*.test.ts
      - name: Clarify verification boundary
        if: always()
        run: |
          echo "These are source-level data/state contract tests only." >> "$GITHUB_STEP_SUMMARY"
          echo "No Expo native builds, SPECS CLAD/LEAF Preview, Mobile Kit BLE or physical hardware are exercised." >> "$GITHUB_STEP_SUMMARY"
