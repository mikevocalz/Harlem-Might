name: Native companion wire
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/modules/walk-companion/**'
      - 'apps/mobile/targets/harlem-watch/CompanionWire.swift'
      - 'apps/mobile/targets/harlem-watch/WalkCompanion.swift'
      - 'apps/wearos/app/src/main/java/com/harlemmight/watch/WalkCompanion.kt'
      - 'tooling/tests/walk-companion/**'
      - '.github/workflows/native-companion-wire.yml'
  pull_request:
    paths:
      - 'apps/mobile/modules/walk-companion/**'
      - 'apps/mobile/targets/harlem-watch/CompanionWire.swift'
      - 'apps/mobile/targets/harlem-watch/WalkCompanion.swift'
      - 'apps/wearos/app/src/main/java/com/harlemmight/watch/WalkCompanion.kt'
      - 'tooling/tests/walk-companion/**'
      - '.github/workflows/native-companion-wire.yml'
permissions:
  contents: read
jobs:
  wire:
    name: ${{ matrix.language }} companion contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            os: macos-15
          - language: kotlin
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Swift and Java are supplied by the hosted images. Kotlin and the host
      # Android JSON implementation are version/checksum pinned in the runner.
      # This job needs no Expo install, private dependencies, SDK or device.
      - name: Compile and execute production companion contracts
        run: node tooling/tests/walk-companion/run.mjs ${{ matrix.language }}
