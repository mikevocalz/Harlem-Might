name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$'; then
            echo '::error::.env files must never be committed'; exit 1
          fi
      # apps/mobile depends on @expo-pico/core as file:../../../expo-pico/...,
      # a sibling checkout of the public expo-pico repo. Only app.config.ts
      # names it (as a config plugin), so install needs the source, not a build.
      - name: Check out expo-pico beside the repo
        run: git clone --depth 1 https://github.com/mikevocalz/expo-pico.git "$GITHUB_WORKSPACE/../expo-pico"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node floor (RN 0.87 requires >= 22.13.0).
          # Bump .nvmrc and the root package.json "engines" together.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm spatial:verify-android
      - run: pnpm spatial:verify-typegpu
      - run: pnpm --filter @acme/spatial test
      # DEFER (2026-10-07): mobile is left out until its /viro-external headset
      # test route resolves in CI. That route imports PanelStack, PanelStat and
      # friends, which exist only on viro-external's unmerged
      # codex/specs-generated-preview branch, and viro-external is private, so
      # this job cannot clone it. Put mobile back when that branch is on
      # viro-external main and CI has read access to the repo.
      - run: pnpm turbo build typecheck lint --filter='!mobile'
