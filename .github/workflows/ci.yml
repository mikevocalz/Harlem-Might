name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$'; then
            echo '::error::.env files must never be committed'; exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node floor (RN 0.87 requires >= 22.13.0).
          # Bump .nvmrc and the root package.json "engines" together.
          node-version-file: .nvmrc
          cache: pnpm
      - name: Load immutable native revisions
        id: native-revisions
        run: node tooling/native-revisions.mjs --github-output "$GITHUB_OUTPUT"
      - name: Test native revision contract
        run: node --test apps/mobile/scripts/native-revisions.test.mjs
      - name: Verify private spatial dependency access
        env:
          DEPENDENCY_TOKEN: ${{ secrets.SPATIAL_DEPENDENCIES_TOKEN }}
        run: |
          if [ -z "$DEPENDENCY_TOKEN" ]; then
            echo "::error::Configure SPATIAL_DEPENDENCIES_TOKEN with read-only Contents access to mikevocalz/viro and mikevocalz/viro-external to validate mobile."
            exit 1
          fi
      - name: Checkout Viro fork
        uses: actions/checkout@v7
        with:
          repository: mikevocalz/viro
          ref: ${{ steps.native-revisions.outputs.viro }}
          token: ${{ secrets.SPATIAL_DEPENDENCIES_TOKEN }}
          path: .spatial-deps/viro
          persist-credentials: false
      - name: Checkout Viro External
        uses: actions/checkout@v7
        with:
          repository: mikevocalz/viro-external
          ref: ${{ steps.native-revisions.outputs.viro_external }}
          token: ${{ secrets.SPATIAL_DEPENDENCIES_TOKEN }}
          path: .spatial-deps/viro-external
          persist-credentials: false
      - name: Checkout Mapbox native bridge
        uses: actions/checkout@v7
        with:
          repository: mikevocalz/nitro-mapbox-ar
          ref: ${{ steps.native-revisions.outputs.nitro_mapbox_ar }}
          path: .spatial-deps/nitro-mapbox-ar
          persist-credentials: false
      - name: Place linked spatial packages
        run: |
          mv .spatial-deps/viro ../viro
          mv .spatial-deps/viro-external ../viro-external
          mv .spatial-deps/nitro-mapbox-ar ../nitro-mapbox-ar
      - name: Verify native sibling checkouts
        run: node tooling/native-revisions.mjs
      - run: pnpm install --frozen-lockfile
      - name: Install linked package dependencies
        run: |
          pnpm --dir ../viro-external install --frozen-lockfile --strict-peer-dependencies=false
          npm ci --prefix ../nitro-mapbox-ar --ignore-scripts --no-audit --no-fund
          mkdir -p ../viro/node_modules/@types
          # Resolve the real package dirs the way TypeScript does: the pnpm
          # catalog layout keeps them out of apps/mobile/node_modules, so
          # hardcoded paths there would be dangling symlinks.
          for pkg in react react-native @types/react; do
            target=$(node -p "require.resolve('$pkg/package.json', { paths: ['$GITHUB_WORKSPACE/apps/mobile'] })" | xargs dirname)
            link=../viro/node_modules/$pkg
            mkdir -p "$(dirname "$link")"
            ln -sfn "$target" "$link"
          done
          # Viro's compiled config plugin runs from the sibling checkout.
          # Share Expo's own locked runtime; another SDK version may be hoisted.
          expo_dir=$(node -p "require.resolve('expo/package.json', { paths: ['$GITHUB_WORKSPACE/apps/mobile'] })" | xargs dirname)
          target=$(node -p "require.resolve('@expo/config-plugins/package.json', { paths: ['$expo_dir'] })" | xargs dirname)
          mkdir -p ../viro/node_modules/@expo
          ln -sfn "$target" ../viro/node_modules/@expo/config-plugins
      - run: pnpm spatial:verify-android
      - run: pnpm spatial:verify-typegpu
      - name: Validate mobile dependency contract
        run: pnpm --filter mobile viro:assert-fork
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile pinned Rive Android descriptor and check ownership
        # Compiles the installed production C++ TU with real pinned RN/Nitro
        # headers, rejects the unpatched source, then runs an ASan/UBSan probe.
        # This is a host compile gate, not an Android NDK link or device test.
        env:
          CXX: clang++
        run: node tooling/verify-rive-android-cpp.mjs
      - name: Run all workspace unit tests
        # Discover each package's test script, preserving its platform-specific setup.
        run: pnpm --recursive --if-present test
      - name: Test generated feature boundaries
        run: pnpm test:generators
      - run: pnpm --filter mobile test:scripts
      - run: pnpm turbo run build typecheck lint
      - name: Require deployable build artifacts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of [
            'apps/web/.next/BUILD_ID',
            'apps/web-vite/.output/server/index.mjs',
            'apps/storybook/storybook-static/index.json',
          ]) {
            if (!fs.existsSync(file) || fs.statSync(file).size === 0) {
              throw new Error(`Build passed without a deployable artifact: ${file}`);
            }
          }
          const catalogue = JSON.parse(fs.readFileSync('apps/storybook/storybook-static/index.json', 'utf8'));
          if (!Object.values(catalogue.entries).some(entry => entry.type === 'story')) {
            throw new Error('Storybook built without any indexed stories');
          }
          NODE
