name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Fail on committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$'; then
            echo '::error::.env files must never be committed'; exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Resolve menu dependency lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/restaurant-menu-viewer'
        run: pnpm install --no-frozen-lockfile
      - name: Commit resolved menu lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/restaurant-menu-viewer'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm produced no lockfile changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(menus): regenerate pnpm lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Frozen install
        if: github.head_ref != 'feat/restaurant-menu-viewer'
        run: pnpm install --frozen-lockfile
      - run: pnpm spatial:verify-android
      - run: pnpm spatial:verify-typegpu
      - run: pnpm --filter @acme/spatial test
      - run: pnpm turbo build typecheck lint
